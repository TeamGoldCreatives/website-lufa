version: 0.2

phases:
  install:
    commands:
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
      - . ~/.nvm/nvm.sh && nvm install 20 && nvm use 20 && node --version

  build:
    commands:
      - . ~/.nvm/nvm.sh && nvm use 20 && npm ci && npm run build

artifacts:
  files:
    - '**/*'
  base-directory: dist
